workflows:
  ios-user:
    name: GoFix iOS
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.avtoservis.app
      vars:
        APP_FLAVOR: user
      flutter: 3.24.5
    scripts:
      - name: Restore Firebase configuration
        script: |
          test -n "$FIREBASE_USER_PLIST_BASE64" || (echo "Set FIREBASE_USER_PLIST_BASE64 in Codemagic" && exit 1)
          echo "$FIREBASE_USER_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build GoFix IPA
        script: flutter build ipa --release --flavor user --dart-define=APP_FLAVOR=user --export-options-plist=$CM_EXPORT_OPTIONS_PLIST
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-owner:
