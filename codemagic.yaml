workflows:
  ios-user:
    name: GoFix iOS
    instance_type: mac_mini_m2
    environment:
      groups:
        - GoFix
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.avtoservis.app
      vars:
        APP_FLAVOR: user
      flutter: 3.24.5
      # Muammoning haqiqiy sababi: aniq Xcode versiyasi belgilanmagani uchun
      # Codemagic har doim eng yangi (26.6) versiyani ishlatib kelgan, va aynan
      # o'sha versiyaning iOS 26.5 SDK'si past deployment target'larni (15.0)
      # e'tiborsiz qoldirib, buni majburan 26.5'ga ko'tarib yuborayotgan edi.
      # Endi barqaror, keng sinalgan versiyani qattiq belgilaymiz.
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Restore Firebase configuration
        script: |
          if [ -z "$FIREBASE_USER_PLIST_BASE64" ]; then
            echo "XATO: FIREBASE_USER_PLIST_BASE64 Codemagic'da o'rnatilmagan yoki bo'sh!"
            exit 1
          fi
          echo "$FIREBASE_USER_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          if ! plutil -lint ios/Runner/GoogleService-Info.plist; then
            echo "XATO: GoogleService-Info.plist buzilgan! FIREBASE_USER_PLIST_BASE64 qiymatini Codemagic'da qayta tekshiring."
            exit 1
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing and build IPA
        script: |
          xcode-project use-profiles
          flutter build ipa --release --build-number=$BUILD_NUMBER --flavor user --dart-define=APP_FLAVOR=user --export-options-plist=$HOME/export_options.plist

          echo "== Tayyor arxivdagi HAQIQIY MinimumOSVersion =="
          plutil -p "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist" | grep -i MinimumOSVersion || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

  ios-owner:
    name: GoFix ustalar iOS
    instance_type: mac_mini_m2
    environment:
      groups:
        - GoFix
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.avtoservis.owner
      vars:
        APP_FLAVOR: owner
      flutter: 3.24.5
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Restore Firebase configuration
        script: |
          if [ -z "$FIREBASE_OWNER_PLIST_BASE64" ]; then
            echo "XATO: FIREBASE_OWNER_PLIST_BASE64 Codemagic'da o'rnatilmagan yoki bo'sh!"
            exit 1
          fi
          echo "$FIREBASE_OWNER_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          if ! plutil -lint ios/Runner/GoogleService-Info.plist; then
            echo "XATO: GoogleService-Info.plist buzilgan! FIREBASE_OWNER_PLIST_BASE64 qiymatini Codemagic'da qayta tekshiring."
            exit 1
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set owner app icon
        script: |
          set -e
          SRC=assets/app_icon_owner.png
          if [ ! -f "$SRC" ]; then
            echo "XATO: assets/app_icon_owner.png topilmadi. 1024x1024 PNG ni repozitoriyga qo'shing."; exit 1
          fi
          ICONSET=ios/Runner/Assets.xcassets/AppIcon.appiconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          # 1024x1024 va alfa-kanalsiz PNG (App Store talabi)
          sips -z 1024 1024 "$SRC" --out /tmp/icon_tmp.png
          sips -s format jpeg /tmp/icon_tmp.png --out /tmp/icon_tmp.jpg
          sips -s format png /tmp/icon_tmp.jpg --out "$ICONSET/icon-1024.png"
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "icon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
      - name: Set up code signing and build IPA
        script: |
          xcode-project use-profiles
          flutter build ipa --release --build-number=$BUILD_NUMBER --flavor owner --dart-define=APP_FLAVOR=owner --export-options-plist=$HOME/export_options.plist

          echo "== Tayyor arxivdagi HAQIQIY MinimumOSVersion =="
          plutil -p "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist" | grep -i MinimumOSVersion || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

